twist_mux:
  ros__parameters:
    topics:
      safety:
        topic: /safety/cmd_vel
        timeout: 0.5
        priority: 0          # highest — emergency stop
      teleop:
        topic: /cmd_vel_key
        timeout: 0.5
        priority: 1          # human override
      navigation:
        topic: /nav_vel
        timeout: 0.5
        priority: 2          # Nav2 output
    output_topic: /cmd_vel
