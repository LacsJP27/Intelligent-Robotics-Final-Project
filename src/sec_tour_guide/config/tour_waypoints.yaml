tour:
  frame_id: "map"
  # Coordinates are in the MAP frame. SLAM starts the robot at (0, 0).
  # The test world upper room extends roughly x: -2.0 to 2.0, y: -1.5 to 3.0
  # These waypoints stay in the open upper room where the robot spawns.
  waypoints:
    - {x: -0.550, y: -0.131, yaw:  1.708, label: "Stop 1"}
    - {x: -0.830, y:  1.892, yaw: -1.454, label: "Stop 2 — far end"}
    # - {x: -0.581, y: -0.224, yaw: -2.179, label: "Stop 3 — return through Stop 1"}
    # - {x: -1.685, y: -1.814, yaw:  1.546, label: "Stop 4 — back to start"}
