tour:
  frame_id: "map"
  # Coordinates are in the MAP frame. SLAM starts the robot at (0, 0).
  # The test world upper room extends roughly x: -2.0 to 2.0, y: -1.5 to 3.0
  # These waypoints stay in the open upper room where the robot spawns.
  waypoints:
    - {x:  0.5, y:  0, yaw: 0.0,  label: "Stop 1 — North end"}
    - {x: -1.0, y:  1.5, yaw: 3.14, label: "Stop 2 — Turn around"}
    - {x:  0.0, y:  0.0, yaw: 0.0,  label: "Stop 3 — Return to start"}
